<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rudraksh Royale V3</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07151b;font-family:Arial,Helvetica,sans-serif}
body{display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:100vw;height:100vh;max-width:720px;max-height:1280px;overflow:hidden;background:#123b25}
canvas{display:block;width:100%;height:100%;touch-action:none}
#rotate{display:none;position:absolute;inset:0;background:#07151b;color:white;z-index:20;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:22px;padding:30px}
@media (orientation:landscape) and (max-height:600px){#rotate{display:flex}}
</style>
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="rotate">For the best Rudraksh Royale experience, hold your phone vertically.</div>
</div>
<script>
"use strict";

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
const W=720,H=1280;
let dpr=1, scale=1, ox=0, oy=0;

function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  canvas.width=Math.floor(innerWidth*dpr);
  canvas.height=Math.floor(innerHeight*dpr);
  scale=Math.min(innerWidth/W,innerHeight/H);
  ox=(innerWidth-W*scale)/2;
  oy=(innerHeight-H*scale)/2;
}
addEventListener("resize",resize); resize();

function X(x){return ox+x*scale}
function Y(y){return oy+y*scale}
function S(v){return v*scale}
function rr(x,y,w,h,r,fill,stroke,lw=1){
  ctx.beginPath();ctx.roundRect(X(x),Y(y),S(w),S(h),S(r));
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.lineWidth=S(lw);ctx.strokeStyle=stroke;ctx.stroke()}
}
function poly(points,fill,stroke,lw=1){
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(X(p[0]),Y(p[1])):ctx.moveTo(X(p[0]),Y(p[1])));
  ctx.closePath(); if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.lineWidth=S(lw);ctx.strokeStyle=stroke;ctx.stroke()}
}
function circle(x,y,r,fill,stroke,lw=1){
  ctx.beginPath();ctx.arc(X(x),Y(y),S(r),0,Math.PI*2);
  if(fill){ctx.fillStyle=fill;ctx.fill()} if(stroke){ctx.lineWidth=S(lw);ctx.strokeStyle=stroke;ctx.stroke()}
}
function line(x1,y1,x2,y2,stroke,lw=1){
  ctx.beginPath();ctx.moveTo(X(x1),Y(y1));ctx.lineTo(X(x2),Y(y2));ctx.strokeStyle=stroke;ctx.lineWidth=S(lw);ctx.stroke()
}
function txt(t,x,y,size,fill="#fff",align="center",weight="800"){
  ctx.font=`${weight} ${S(size)}px Arial`;
  ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillStyle=fill;ctx.fillText(t,X(x),Y(y));
}
function shadow(on=true){
  ctx.shadowColor=on?"rgba(0,0,0,.42)":"transparent";ctx.shadowBlur=on?S(12):0;ctx.shadowOffsetY=on?S(5):0;
}
function clearShadow(){ctx.shadowColor="transparent";ctx.shadowBlur=0;ctx.shadowOffsetY=0}

const arena={top:108,bottom:1092,riverTop:608,riverBottom:706,deckTop:1092};
const cards=[
 {name:"Emberheart",cost:3,type:"ember"},
 {name:"Skyfang",cost:2,type:"sky"},
 {name:"Ironwarden",cost:4,type:"iron"},
 {name:"Stormling",cost:1,type:"storm"}
];

let state="menu",time=150,elixir=5,selected=-1,last=0,aiClock=0;
let playerTowers,enemyTowers,troops=[],fx=[],floaters=[];
let shake=0;

function reset(){
 time=150;elixir=5;selected=-1;aiClock=0;troops=[];fx=[];floaters=[];shake=0;
 playerTowers=[
  {x:150,y:910,hp:3200,max:3200,kind:"side",team:"blue"},
  {x:570,y:910,hp:3200,max:3200,kind:"side",team:"blue"},
  {x:360,y:1025,hp:4500,max:4500,kind:"king",team:"blue"}
 ];
 enemyTowers=[
  {x:150,y:260,hp:3200,max:3200,kind:"side",team:"red"},
  {x:570,y:260,hp:3200,max:3200,kind:"side",team:"red"},
  {x:360,y:205,hp:4500,max:4500,kind:"king",team:"red"}
 ];
 state="play";
}
function rand(a,b){return a+Math.random()*(b-a)}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}

function drawBackground(t){
  const g=ctx.createLinearGradient(0,Y(arena.top),0,Y(arena.bottom));
  g.addColorStop(0,"#8bd34f");g.addColorStop(.45,"#68bd45");g.addColorStop(1,"#55a83d");
  ctx.fillStyle=g;ctx.fillRect(X(0),Y(arena.top),S(W),S(arena.bottom-arena.top));

  // subtle checkerland
  for(let yy=arena.top;yy<arena.bottom;yy+=96){
    for(let xx=0;xx<W;xx+=96){
      if(((xx/96+yy/96)&1)===0){
        ctx.fillStyle="rgba(255,255,255,.035)";
        ctx.fillRect(X(xx),Y(yy),S(96),S(96));
      }
    }
  }

  // paths
  const path="#d8c58b", path2="#c9b376";
  rr(112,arena.top+45,94,arena.bottom-arena.top-90,42,path);
  rr(514,arena.top+45,94,arena.bottom-arena.top-90,42,path);
  rr(313,arena.top+20,94,arena.bottom-arena.top-40,42,path);
  for(let y=arena.top+65;y<arena.bottom-40;y+=64){
    rr(125,y,68,22,10,path2);rr(527,y,68,22,10,path2);rr(326,y,68,22,10,path2);
  }

  // river
  const rg=ctx.createLinearGradient(0,Y(arena.riverTop),0,Y(arena.riverBottom));
  rg.addColorStop(0,"#35c9ee");rg.addColorStop(.5,"#0ea8d5");rg.addColorStop(1,"#087da9");
  ctx.fillStyle=rg;ctx.fillRect(X(0),Y(arena.riverTop),S(W),S(arena.riverBottom-arena.riverTop));
  for(let i=0;i<12;i++){
    const yy=arena.riverTop+15+(i%4)*21;
    const xx=(i*83+(t*0.025)%83)-40;
    line(xx,yy,xx+52,yy,"rgba(255,255,255,.55)",3);
  }
  line(0,arena.riverTop,720,arena.riverTop,"rgba(255,255,255,.35)",3);
  line(0,arena.riverBottom,720,arena.riverBottom,"rgba(0,50,80,.25)",5);

  // bridges
  bridge(150,arena.riverTop);
  bridge(360,arena.riverTop);
  bridge(570,arena.riverTop);

  // edge stones
  for(let x=-10;x<730;x+=52){
    stone(x,92,48,25);stone(x,1102,48,25);
  }

  // forest border
  for(let x=25;x<710;x+=92){
    pine(x,125,1.15);pine(x+38,1140,1.05);
  }
  for(let x=12;x<80;x+=42){pine(x,430,1);pine(x+8,790,1.1)}
  for(let x=640;x<720;x+=42){pine(x,430,1);pine(x-10,790,1.1)}

  // rocks
  rock(42,340,1.1);rock(670,355,1);rock(56,1000,.9);rock(665,1000,1);
  crystal(62,500,1.0,"#53dcff");crystal(657,495,.9,"#53dcff");
  crystal(52,1160,.9,"#6be5ff");crystal(670,1160,1.05,"#6be5ff");

  // torches
  torch(72,170,t);torch(648,170,t);torch(72,1040,t);torch(648,1040,t);
}

function stone(x,y,w,h){
  rr(x,y,w,h,7,"#687c7e","#344d50",2);
  line(x+8,y+7,x+w-7,y+7,"rgba(255,255,255,.25)",2);
}
function pine(x,y,s=1){
  ctx.save();ctx.translate(X(x),Y(y));ctx.scale(scale*s,scale*s);
  ctx.fillStyle="#173e2d";ctx.beginPath();ctx.moveTo(0,-54);ctx.lineTo(-34,15);ctx.lineTo(34,15);ctx.closePath();ctx.fill();
  ctx.fillStyle="#1d5639";ctx.beginPath();ctx.moveTo(0,-38);ctx.lineTo(-43,38);ctx.lineTo(43,38);ctx.closePath();ctx.fill();
  ctx.fillStyle="#2a7044";ctx.beginPath();ctx.moveTo(0,-22);ctx.lineTo(-48,60);ctx.lineTo(48,60);ctx.closePath();ctx.fill();
  ctx.fillStyle="#5a3d27";ctx.fillRect(-6,58,12,24);
  ctx.restore();
}
function rock(x,y,s){
  poly([[x-28*s,y+18*s],[x-36*s,y-8*s],[x-12*s,y-32*s],[x+20*s,y-26*s],[x+34*s,y+8*s],[x+18*s,y+25*s]],"#536c6c","#2f4849",3);
  line(x-15*s,y-10*s,x+10*s,y-18*s,"rgba(255,255,255,.22)",3);
}
function crystal(x,y,s,c){
  ctx.save();ctx.shadowColor=c;ctx.shadowBlur=S(18*s);
  poly([[x,y-50*s],[x+24*s,y-10*s],[x+13*s,y+42*s],[x-18*s,y+34*s],[x-26*s,y-8*s]],c,"rgba(255,255,255,.75)",3);
  poly([[x,y-50*s],[x+2*s,y+22*s],[x-18*s,y+34*s],[x-26*s,y-8*s]],"rgba(255,255,255,.22)");
  ctx.restore();
}
function torch(x,y,t){
  circle(x,y+24,18,"#70462b","#3c2a20",3);
  line(x,y+22,x,y-20,"#71452a",7);
  const rrn=10+Math.sin(t*.006+x)*2;
  ctx.save();ctx.shadowColor="#ff9b27";ctx.shadowBlur=S(18);
  poly([[x,y-18],[x-rrn,y+2],[x,y+15],[x+rrn,y+2]],"#ff9b27");
  poly([[x,y-13],[x-5,y+2],[x,y+8],[x+5,y+2]],"#fff0a3");
  ctx.restore();
}
function bridge(cx,top){
  rr(cx-72,top-2,144,106,8,"#9a6a3c","#5a3a26",5);
  for(let x=cx-58;x<=cx+58;x+=29) line(x,top+2,x,top+100,"#6d472d",4);
  for(let x=cx-62;x<=cx+62;x+=31) rr(x,top+13,22,11,3,"#bd8a52","#714a2e",2);
  stone(cx-74,top+6,18,92);stone(cx+56,top+6,18,92);
  stone(cx-74,top+90,18,18);stone(cx+56,top+90,18,18);
}

function drawHUD(){
  // top player banner
  shadow();
  rr(18,12,260,80,22,"rgba(7,24,38,.94)","#1c83d4",4);
  clearShadow();
  // crown badge
  poly([[42,27],[59,18],[76,27],[73,58],[58,70],[43,58]],"#f7c938","#fff0a0",2);
  txt("♛",59,45,28,"#fff");
  txt("ShadowRex",88,36,27,"#ffcf3b","left","900");
  txt("No Clan",88,66,17,"#fff","left","700");

  shadow();rr(492,12,210,80,22,"rgba(7,24,38,.94)","#1c83d4",4);clearShadow();
  txt("TIME LEFT",597,33,15,"#d9eaff");
  txt(formatTime(),597,64,31,"#fff");

  // selected instruction only, safely between river and deck
  if(selected>=0){
    rr(180,720,360,44,18,"rgba(7,31,44,.84)","#6de5ff",2);
    txt("Tap your side to deploy",360,742,18,"#fff");
  }
}
function formatTime(){
  const s=Math.max(0,Math.ceil(time));
  return `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
}

function hpBar(x,y,w,h,hp,max,team,showText=true){
  rr(x,y,w,h,h/2,"#172530","#07141b",3);
  const fill=clamp(hp/max,0,1);
  rr(x+3,y+3,(w-6)*fill,h-6,(h-6)/2,team==="blue"?"#18c8ff":"#ff405a");
  if(showText)txt(Math.ceil(Math.max(0,hp)),x+w/2,y+h/2+1,17,"#fff");
}

function tower(t){
  const blue=t.team==="blue", main=blue?"#1678c7":"#c9334c", light=blue?"#69dcff":"#ff7180";
  const y=t.y, x=t.x, big=t.kind==="king";
  // shadow
  shadow();
  rr(x-(big?72:62),y-(big?60:48),big?144:124,big?108:96,24,"#e7e4d8","#53656b",7);
  clearShadow();

  // body
  rr(x-(big?61:51),y-(big?48:40),big?122:102,big?84:72,18,main,"#253a44",4);
  // vertical plates
  rr(x-(big?50:41),y-(big?38:31),16,big?65:55,7,"rgba(255,255,255,.20)");
  rr(x+(big?34:25),y-(big?38:31),16,big?65:55,7,"rgba(0,0,0,.16)");

  // crystal core
  ctx.save();ctx.shadowColor=light;ctx.shadowBlur=S(20);
  poly([[x,y-(big?34:29)],[x+25,y-(big?8:4)],[x+16,y+(big?30:25)],[x-17,y+(big?30:25)],[x-25,y-(big?8:4)]],blue?"#9bf3ff":"#ff9aa5","#fff",3);
  ctx.restore();

  // crown/helm
  circle(x,y-(big?78:63),big?25:20,blue?"#1e5f91":"#8f2538","#e9eef0",4);
  txt("♛",x,y-(big?78:63),big?25:19,"#ffd24a");

  // top ornament
  rr(x-(big?38:30),y-(big?103:85),big?76:60,10,5,blue?"#27cfff":"#ff405a","#172b34",2);

  // HP
  const bw=big?178:150;
  hpBar(x-bw/2,y-(big?126:101),bw,28,t.hp,t.max,t.team,true);
  if(t.kind==="king") txt("KING",x,y-(big?143:118),12,"#fff");
}

function drawDeck(){
  shadow();
  rr(18,1100,684,164,30,"#0a2945","#087bc9",5);
  clearShadow();

  const cw=145,gap=18,start=25;
  cards.forEach((c,i)=>{
    const x=start+i*(cw+gap), y=1118, active=selected===i;
    rr(x,y,cw,128,20,active?"#164f79":"#0c3b63",active?"#72e8ff":"#1a75b6",active?6:3);
    drawCardIcon(c,x+cw/2,y+53,1);
    txt(c.name,x+cw/2,y+104,15,"#fff");
    circle(x+cw/2,y+136,19,"#b92df0","#f5a5ff",3);
    txt(String(c.cost),x+cw/2,y+137,17,"#fff");
  });

  // elixir
  rr(95,1240,580,17,9,"#142333","#06131b",3);
  const ew=580*clamp(elixir/10,0,1);
  if(ew>0)rr(95,1240,ew,17,9,"#d02bea");
  circle(66,1248,31,"#bd27e9","#f19bff",4);
  txt("♦",66,1248,24,"#fff");
  txt(`${Math.floor(elixir)}/10`,155,1248,22,"#fff","left","900");
}
function drawCardIcon(c,x,y,s){
  if(c.type==="ember"){
    circle(x,y+8,30,"#10253a");
    poly([[x,y-34],[x+28,y+22],[x,y+12],[x-28,y+22]],"#ff6b22","#ffd05a",2);
    circle(x,y-5,14,"#ffca58");
    circle(x,y-5,8,"#ff5a30");
  } else if(c.type==="sky"){
    circle(x,y,30,"#5edfff","#a8f5ff",3);
    poly([[x,y-39],[x+35,y+5],[x,y+28],[x-35,y+5]],"#2389dd","#a8f5ff",2);
    circle(x+8,y-3,5,"#071d35");circle(x+22,y-3,5,"#071d35");
  } else if(c.type==="iron"){
    circle(x,y,31,"#5d6e77","#d5e2e6",4);
    circle(x,y,12,"#56d9ff");
    for(let a=0;a<4;a++){const q=a*Math.PI/2;rr(x+Math.cos(q)*27-5,y+Math.sin(q)*27-5,10,10,3,"#a7b8be")}
  } else {
    circle(x,y,31,"#65dcff","#b8f6ff",3);
    circle(x-10,y-4,5,"#102a4c");circle(x+10,y-4,5,"#102a4c");
    line(x-26,y-18,x-38,y-28,"#aaf4ff",3);line(x+26,y-18,x+38,y-28,"#aaf4ff",3);
  }
}

function spawn(type,team,x,y){
  const def=type==="ember"?{hp:900,dmg:95,range:48,spd:28,r:25,atk:.8}:type==="sky"?{hp:520,dmg:75,range:145,spd:32,r:22,atk:.9}:type==="iron"?{hp:1500,dmg:125,range:55,spd:18,r:30,atk:1.1}:{hp:360,dmg:52,range:120,spd:38,r:19,atk:.55};
  troops.push({type,team,x,y,homeY:y,hp:def.hp,max:def.hp,dmg:def.dmg,range:def.range,spd:def.spd,r:def.r,atk:def.atk,cd:0,phase:Math.random()*6});
}
function deploy(i,x,y,team="blue"){
  const c=cards[i];
  if(team==="blue"){
    if(elixir<c.cost)return false;
    elixir-=c.cost;
  }
  spawn(c.type,team,x,y);
  for(let k=0;k<8;k++)fx.push({x,y,life:.5+Math.random()*.4,max:.9,vx:rand(-30,30),vy:rand(-40,10),type:"spark",team});
  return true;
}

function updateTroops(dt){
  for(const u of troops){
    u.cd-=dt;u.phase+=dt*4;
    let target=null,best=1e9;
    for(const v of troops){
      if(v.team===u.team||v.hp<=0)continue;
      const d=Math.hypot(v.x-u.x,v.y-u.y);
      if(d<best && d<220){best=d;target=v}
    }
    const towers=u.team==="blue"?enemyTowers:playerTowers;
    if(!target){
      for(const t of towers){
        if(t.hp<=0)continue;
        const d=Math.hypot(t.x-u.x,t.y-u.y);
        if(d<best){best=d;target=t}
      }
    }
    if(target){
      const d=Math.hypot(target.x-u.x,target.y-u.y);
      if(d<=u.range+(target.r||34)){
        if(u.cd<=0){
          target.hp-=u.dmg;
          u.cd=u.atk;
          fx.push({x:target.x,y:target.y,life:.28,max:.28,vx:0,vy:0,type:"hit",team:u.team});
          floaters.push({x:target.x,y:target.y-40,text:"-"+u.dmg,life:.65});
        }
      } else {
        const dx=(target.x-u.x)/Math.max(d,1),dy=(target.y-u.y)/Math.max(d,1);
        u.x+=dx*u.spd*dt;u.y+=dy*u.spd*dt;
      }
    }
    u.x=clamp(u.x,55,665);u.y=clamp(u.y,125,1065);
  }
  troops=troops.filter(u=>u.hp>0);
}
function updateAI(dt){
  aiClock+=dt;
  if(aiClock>3.2){
    aiClock=0;
    const i=Math.floor(Math.random()*cards.length);
    const lane=Math.random()<.5?150:570;
    deploy(i,lane+rand(-35,35),rand(330,520),"red");
  }
}

function updateFX(dt){
  for(const p of fx){
    p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=30*dt;
  }
  fx=fx.filter(p=>p.life>0);
  for(const f of floaters){f.life-=dt;f.y-=28*dt}
  floaters=floaters.filter(f=>f.life>0);
}

function drawTroop(u,t){
  const blue=u.team==="blue";
  const glow=blue?"#38d8ff":"#ff4d68";
  ctx.save();
  ctx.shadowColor=glow;ctx.shadowBlur=S(15);
  const bob=Math.sin(u.phase)*3;
  if(u.type==="ember"){
    circle(u.x,u.y+bob,25,"#202d3a","#ff9b32",3);
    circle(u.x,u.y-7+bob,17,"#ff6d22","#ffd15a",3);
    poly([[u.x-16,u.y+5+bob],[u.x,u.y-30+bob],[u.x+16,u.y+5+bob]],"#ffb52e");
    circle(u.x-6,u.y-8+bob,3,"#fff0a0");circle(u.x+6,u.y-8+bob,3,"#fff0a0");
  } else if(u.type==="sky"){
    poly([[u.x,u.y-30+bob],[u.x+28,u.y+7+bob],[u.x+5,u.y+22+bob],[u.x-28,u.y+7+bob]],"#2a9ae8","#b8f8ff",3);
    circle(u.x,u.y-2+bob,12,"#65e8ff");
    circle(u.x-5,u.y-5+bob,3,"#09213b");circle(u.x+5,u.y-5+bob,3,"#09213b");
  } else if(u.type==="iron"){
    circle(u.x,u.y+bob,30,"#3c4e59","#b9c8ce",4);
    circle(u.x,u.y-2+bob,18,blue?"#145b83":"#8f2c3f","#e3f4f8",2);
    circle(u.x,u.y-2+bob,7,"#60dcff");
    for(let a=0;a<4;a++){const q=a*Math.PI/2;circle(u.x+Math.cos(q)*27,u.y+Math.sin(q)*27+bob,6,"#9cafb5")}
  } else {
    circle(u.x,u.y+bob,22,"#64dfff","#c4fbff",3);
    circle(u.x-7,u.y-3+bob,4,"#102944");circle(u.x+7,u.y-3+bob,4,"#102944");
    poly([[u.x-17,u.y-17+bob],[u.x-31,u.y-30+bob],[u.x-15,u.y-25+bob]],"#79eaff");
    poly([[u.x+17,u.y-17+bob],[u.x+31,u.y-30+bob],[u.x+15,u.y-25+bob]],"#79eaff");
  }
  ctx.restore();
  hpBar(u.x-31,u.y-u.r-20,62,10,u.hp,u.max,u.team,false);
  txt(String(Math.max(1,Math.ceil(u.hp/u.max*4))),u.x,u.y-u.r-31,12,"#fff");
}

function drawFX(){
  for(const p of fx){
    const a=clamp(p.life/p.max,0,1);
    if(p.type==="spark"){circle(p.x,p.y,3*a,p.team==="blue"?"#8df4ff":"#ff8aa0")}
    else {circle(p.x,p.y,18*(1-a),"rgba(255,255,255,.0)",p.team==="blue"?"#74efff":"#ff6a7e",4)}
  }
  for(const f of floaters){
    txt(f.text,f.x,f.y,15,"#fff");
  }
}

function checkEnd(){
  const enemyKing=enemyTowers[2], playerKing=playerTowers[2];
  if(enemyKing.hp<=0){state="win"}
  if(playerKing.hp<=0){state="lose"}
  if(time<=0){
    const p=playerTowers.reduce((a,t)=>a+t.hp,0),e=enemyTowers.reduce((a,t)=>a+t.hp,0);
    state=p>=e?"win":"lose";
  }
}

function drawOverlay(){
  if(state==="menu"){
    ctx.fillStyle="rgba(3,13,20,.48)";ctx.fillRect(X(0),Y(0),S(W),S(H));
    shadow();rr(62,330,596,390,36,"rgba(5,24,39,.96)","#42cfff",5);clearShadow();
    txt("♛  RUDRAKSH",360,405,34,"#ffd23f");
    txt("ROYALE",360,450,46,"#fff");
    txt("V3 • FANTASY ARENA",360,493,17,"#7feaff");
    rr(168,550,384,72,24,"#12629a","#68e9ff",4);
    txt("TAP TO BATTLE",360,586,24,"#fff");
    txt("Original art • mobile ready",360,660,16,"#bfe8f4");
  } else if(state==="win"||state==="lose"){
    ctx.fillStyle="rgba(3,13,20,.58)";ctx.fillRect(X(0),Y(0),S(W),S(H));
    shadow();rr(75,390,570,300,34,"rgba(5,24,39,.97)","#42cfff",5);clearShadow();
    txt(state==="win"?"VICTORY!":"BATTLE OVER",360,475,42,state==="win"?"#ffd23f":"#ff7384");
    txt(state==="win"?"Your arena stands strong.":"The arena needs a rematch.",360,530,18,"#fff");
    rr(195,580,330,62,22,"#12629a","#68e9ff",4);
    txt("PLAY AGAIN",360,611,22,"#fff");
  }
}

function draw(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  ctx.save();
  drawBackground(t);
  // subtle top/bottom vignettes
  const vg=ctx.createLinearGradient(0,Y(0),0,Y(H));
  vg.addColorStop(0,"rgba(0,0,0,.16)");vg.addColorStop(.15,"transparent");vg.addColorStop(.85,"transparent");vg.addColorStop(1,"rgba(0,0,0,.25)");
  ctx.fillStyle=vg;ctx.fillRect(X(0),Y(0),S(W),S(H));
  enemyTowers.forEach(tower);playerTowers.forEach(tower);
  troops.forEach(u=>drawTroop(u,t));
  drawFX();
  drawHUD();
  drawDeck();
  drawOverlay();
  ctx.restore();
}

function pointer(e){
  const r=canvas.getBoundingClientRect();
  const x=(e.clientX-r.left)/scale;
  const y=(e.clientY-r.top)/scale;
  if(state==="menu"){reset();return}
  if(state==="win"||state==="lose"){reset();return}
  if(y>=1110){
    const cw=145,gap=18,start=25;
    for(let i=0;i<4;i++){
      const xx=start+i*(cw+gap);
      if(x>=xx&&x<=xx+cw&&y<=1240){
        selected=selected===i?-1:i;return
      }
    }
    return
  }
  if(selected>=0 && y>720 && y<1080){
    if(deploy(selected,clamp(x,80,640),clamp(y,750,1050),"blue"))selected=-1;
  }
}
canvas.addEventListener("pointerdown",pointer,{passive:true});

function loop(ts){
  const dt=Math.min(.033,(ts-last)/1000||.016);last=ts;
  if(state==="play"){
    time-=dt;elixir=Math.min(10,elixir+dt*.72);
    updateTroops(dt);updateAI(dt);updateFX(dt);checkEnd();
  } else updateFX(dt);
  draw(ts);
  requestAnimationFrame(loop);
}
reset();state="menu";requestAnimationFrame(loop);
</script>
</body>
</html>
