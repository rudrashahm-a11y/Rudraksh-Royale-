<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Rudraksh Royale v2.0</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07121a;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
body{touch-action:none}
#game{display:block;width:100vw;height:100vh}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#07121a;color:#fff;z-index:10;font-weight:800}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="loading">Loading Rudraksh Royale v2.0…</div>
<script>
"use strict";

/* =========================================================
   RUDRAKSH ROYALE v2.0
   Original single-file canvas game.
   No external assets required.
   ========================================================= */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const TAU = Math.PI * 2;

let W=0,H=0,DPR=1;
let state="menu";
let last=0, timeLeft=180;
let selectedCard=-1;
let elixir=5;
let aiElixir=5;
let particles=[];
let projectiles=[];
let troops=[];
let aiClock=2.2;
let message="";
let messageTime=0;
let shake=0;

const cards=[
  {name:"Emberblade",cost:3,type:"ember",hp:620,damage:95,range:42,speed:45,rate:.9,color:"#ff6a21"},
  {name:"Skyfang",cost:2,type:"sky",hp:330,damage:72,range:185,speed:58,rate:.8,color:"#57bfff"},
  {name:"Ironwarden",cost:4,type:"iron",hp:1250,damage:135,range:52,speed:27,rate:1.25,color:"#8da7bd"},
  {name:"Stormling",cost:1,type:"storm",hp:230,damage:48,range:145,speed:72,rate:.55,color:"#74d7ff"}
];

const towers=[
  {team:"enemy",kind:"left",x:.27,y:.16,hp:3200,max:3200,range:250,damage:105,rate:1.0,cool:0},
  {team:"enemy",kind:"king",x:.50,y:.095,hp:4500,max:4500,range:280,damage:125,rate:.9,cool:0},
  {team:"enemy",kind:"right",x:.73,y:.16,hp:3200,max:3200,range:250,damage:105,rate:1.0,cool:0},
  {team:"player",kind:"left",x:.27,y:.78,hp:3200,max:3200,range:250,damage:105,rate:1.0,cool:0},
  {team:"player",kind:"king",x:.50,y:.875,hp:4500,max:4500,range:280,damage:125,rate:.9,cool:0},
  {team:"player",kind:"right",x:.73,y:.78,hp:3200,max:3200,range:250,damage:105,rate:1.0,cool:0}
];

function arenaTop(){return 70}
function deckH(){return Math.min(190,Math.max(160,H*.205))}
function arenaBottom(){return H-deckH()-8}
function riverY(){return H*.505}
function laneX(side){return side==="left"?W*.34:W*.66}

function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.floor(W*DPR); canvas.height=Math.floor(H*DPR);
  canvas.style.width=W+"px"; canvas.style.height=H+"px";
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener("resize",resize);
resize();

function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function towerPos(t){return {x:t.x*W,y:lerp(arenaTop()+55,arenaBottom()-20,t.y)}}
function aliveTowers(team){return towers.filter(t=>t.team===team&&t.hp>0)}
function enemyTower(team){return team==="player"?"enemy":"player"}

function roundedRect(x,y,w,h,r,fill,stroke,lw=1){
  ctx.beginPath();
  ctx.roundRect(x,y,w,h,r);
  if(fill){ctx.fillStyle=fill;ctx.fill()}
  if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke()}
}
function text(txt,x,y,size,fill="#fff",align="center",weight=800){
  ctx.font=`${weight} ${size}px system-ui,-apple-system,Segoe UI,Roboto,Arial`;
  ctx.textAlign=align;ctx.textBaseline="middle";ctx.fillStyle=fill;ctx.fillText(txt,x,y);
}
function shadow(on=true){ctx.shadowColor=on?"rgba(0,0,0,.38)":"transparent";ctx.shadowBlur=on?10:0;ctx.shadowOffsetY=on?5:0}

function drawBackground(){
  const top=arenaTop(), bottom=arenaBottom(), ry=riverY();
  let g=ctx.createLinearGradient(0,top,0,bottom);
  g.addColorStop(0,"#77d34c");g.addColorStop(.48,"#68c94a");g.addColorStop(1,"#4aa83f");
  ctx.fillStyle=g;ctx.fillRect(0,top,W,bottom-top);

  // subtle lane paths
  ctx.lineCap="round";
  for(const x of [W*.27,W*.50,W*.73]){
    ctx.strokeStyle="rgba(235,210,142,.5)";ctx.lineWidth=Math.max(18,W*.035);
    ctx.beginPath();ctx.moveTo(x,top+25);ctx.lineTo(x,ry-35);ctx.stroke();
    ctx.beginPath();ctx.moveTo(x,ry+35);ctx.lineTo(x,bottom-20);ctx.stroke();
  }

  // stone path tiles
  for(const x of [W*.27,W*.50,W*.73]){
    for(let y=top+25;y<bottom-10;y+=34){
      if(Math.abs(y-ry)<65)continue;
      ctx.fillStyle="rgba(224,198,132,.72)";
      roundedRect(x-11,y-8,22,16,5,"rgba(224,198,132,.72)");
    }
  }

  // river
  ctx.fillStyle="#19bce7";ctx.fillRect(0,ry-45,W,90);
  let rg=ctx.createLinearGradient(0,ry-45,0,ry+45);
  rg.addColorStop(0,"#087dbd");rg.addColorStop(.5,"#29d6ee");rg.addColorStop(1,"#087dbd");
  ctx.fillStyle=rg;ctx.fillRect(0,ry-45,W,90);

  for(let i=0;i<12;i++){
    const xx=(i*97+(performance.now()/45)%97)%W;
    ctx.strokeStyle="rgba(255,255,255,.34)";ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(xx,ry-16);
    ctx.quadraticCurveTo(xx+25,ry-27,xx+52,ry-16);
    ctx.stroke();
  }

  // banks
  ctx.fillStyle="#718a57";ctx.fillRect(0,ry-49,W,6);ctx.fillRect(0,ry+43,W,6);

  // bridges
  for(const bx of [W*.34,W*.66]) drawBridge(bx,ry);

  // border stones
  for(let x=0;x<W;x+=42){
    drawStone(x,top-2,38,18);
    drawStone(x,bottom-1,38,18);
  }

  for(let y=top+15;y<bottom;y+=42){
    drawStone(7,y,16,38);
    drawStone(W-23,y,16,38);
  }

  // forest / crystals / torches
  for(let i=0;i<15;i++){
    const side=i%2?W-40:40;
    const yy=top+35+(i*73)%Math.max(100,bottom-top-70);
    drawPine(side,yy,22+(i%3)*5);
  }

  for(const p of [
    [W*.07,top+115],
    [W*.93,top+150],
    [W*.08,bottom-70],
    [W*.92,bottom-55]
  ]) drawCrystal(p[0],p[1],22);

  for(const p of [
    [W*.12,top+65],
    [W*.88,top+65],
    [W*.12,bottom-100],
    [W*.88,bottom-100]
  ]) drawTorch(p[0],p[1]);
}

function drawStone(x,y,w,h){
  roundedRect(x,y,w,h,5,"#5b6870","#303d42",2);
  ctx.fillStyle="rgba(255,255,255,.15)";
  ctx.fillRect(x+4,y+3,w-8,3);
}

function drawPine(x,y,s){
  ctx.fillStyle="#173f2d";
  ctx.beginPath();
  ctx.moveTo(x,y-s*1.6);
  ctx.lineTo(x-s,y+s*.8);
  ctx.lineTo(x+s,y+s*.8);
  ctx.closePath();
  ctx.fill();

  ctx.fillStyle="#276844";
  ctx.beginPath();
  ctx.moveTo(x,y-s);
  ctx.lineTo(x-s*.8,y+s);
  ctx.lineTo(x+s*.8,y+s);
  ctx.closePath();
  ctx.fill();
}

function drawCrystal(x,y,s){
  ctx.save();
  shadow();
  ctx.fillStyle="#48bfff";
  ctx.beginPath();
  ctx.moveTo(x,y-s);
  ctx.lineTo(x+s*.55,y-s*.15);
  ctx.lineTo(x+s*.35,y+s);
  ctx.lineTo(x-s*.35,y+s);
  ctx.lineTo(x-s*.55,y-s*.15);
  ctx.closePath();
  ctx.fill();
  ctx.strokeStyle="#b9f4ff";
  ctx.lineWidth=2;
  ctx.stroke();
  shadow(false);
  ctx.restore();
}

function drawTorch(x,y){
  ctx.save();
  ctx.fillStyle="#4c4d48";
  ctx.fillRect(x-5,y,10,26);

  const glow=ctx.createRadialGradient(x,y,2,x,y,32);
  glow.addColorStop(0,"rgba(255,210,75,.7)");
  glow.addColorStop(1,"rgba(255,120,20,0)");

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(x,y,32,0,TAU);
  ctx.fill();

  ctx.fillStyle="#ffbd3b";
  ctx.beginPath();
  ctx.moveTo(x,y-20);
  ctx.quadraticCurveTo(x+10,y-8,x,y);
  ctx.quadraticCurveTo(x-9,y-8,x,y-20);
  ctx.fill();
  ctx.restore();
}

function drawBridge(x,y){
  const bw=Math.min(112,W*.18);
  shadow();

  roundedRect(
    x-bw/2,y-48,bw,96,7,
    "#9b6737","#55351e",4
  );

  shadow(false);

  for(let yy=y-42;yy<y+43;yy+=16){
    ctx.strokeStyle="#5b381f";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x-bw/2+6,yy);
    ctx.lineTo(x+bw/2-6,yy);
    ctx.stroke();
  }

  for(const sx of [x-bw/2-7,x+bw/2-7]){
    roundedRect(sx,y-52,14,104,4,"#89969a","#3f4a4d",2);
  }
}
      function drawTopHUD(){
  // title
  roundedRect(
    12,10,Math.min(390,W*.48),58,18,
    "rgba(7,23,39,.88)","#1a80cf",2
  );

  text(
    "♛ Rudraksh Royale",
    28,29,
    Math.min(25,W*.052),
    "#ffcf4a","left",900
  );

  roundedRect(190,35,75,25,12,"#0b2945","#4db9ff",2);
  text("v2.0",227,47,14,"#fff");

  // player panel
  roundedRect(
    12,76,190,64,18,
    "rgba(5,25,47,.9)","#167bd0",2
  );

  text("♜",32,103,25,"#50bfff");
  text("ShadowRex",58,97,17,"#fff","left",900);
  text("No Clan",58,119,13,"#9bd5ff","left",700);

  // timer
  const tw=Math.min(170,W*.28);

  roundedRect(

  );

function drawHPBar(x,y,w,h,hp,max,team,showNumber=true){
  roundedRect(
    x,y,w,h,h/2,
    "#101820","#27333a",2
  );

  const pct=clamp(hp/max,0,1);
  const fill=team==="player"?"#1ec8ff":"#ff3d52";

  if(pct>0){
    roundedRect(
      x+2,y+2,(w-4)*pct,h-4,(h-4)/2,
      fill
    );
  }

  if(showNumber){
    text(
      Math.max(0,Math.ceil(hp)),
      x+w/2,
      y+h/2+.5,
      Math.max(11,h*.85),
      "#fff","center",900
    );
  }
}

function drawTower(t){
  const p=towerPos(t);
  const s=t.kind==="king"?1.22:1;
  const w=82*s;
  const h=88*s;

  ctx.save();
  shadow();

  // base
  roundedRect(
    p.x-w/2,
    p.y-h*.22,
    w,
    h*.72,
    15,
    t.team==="player"?"#d3e1e8":"#d8c9bc",
    "#35434b",
    4
  );

  // colored armor
  const team=t.team==="player";

  roundedRect(
    p.x-w*.40,
    p.y-h*.18,
    w*.80,
    h*.55,
    12,
    team?"#197ac7":"#bd3543",
    "#263c4c",
    3
  );

  // crystal core
  ctx.fillStyle=team?"#55dcff":"#ff4c5e";

  ctx.beginPath();
  ctx.moveTo(p.x,p.y-h*.34);
  ctx.lineTo(p.x+18*s,p.y-h*.04);
  ctx.lineTo(p.x,p.y+h*.18);
  ctx.lineTo(p.x-18*s,p.y-h*.04);
  ctx.closePath();
  ctx.fill();

  ctx.strokeStyle="#fff";
  ctx.globalAlpha=.55;
  ctx.stroke();
  ctx.globalAlpha=1;

  // crown / head
  ctx.fillStyle=team?"#8cc9e8":"#e5b0a0";
  ctx.beginPath();
  ctx.arc(p.x,p.y-h*.47,18*s,0,TAU);
  ctx.fill();

  text(
    t.kind==="king"?"♛":"♜",
    p.x,
    p.y-h*.48,
    22*s,
    team?"#0b4770":"#6e1721"
  );

  shadow(false);
  ctx.restore();

  const bw=t.kind==="king"?112:96;

  drawHPBar(
    p.x-bw/2,
    p.y-h*.76,
    bw,
    18,
    t.hp,
    t.max,
    t.team,
    true
  );

  if(t.kind==="king")
    text("4500",p.x,p.y-h*.86,0,"#fff");
}

function drawDeck(){
  const y=H-deckH();
  const panelH=deckH();

  // outer panel
  roundedRect(
    12,y,W-24,panelH,24,
    "rgba(5,28,52,.97)","#087dd4",3
  );

  // card row
  const gap=8;
  const pad=18;
  const cardY=y+14;
  const cw=(W-pad*2-gap*3)/4;
  const ch=Math.min(112,panelH-58);

  cards.forEach((c,i)=>{
    const x=pad+i*(cw+gap);
    const chosen=i===selectedCard;

    roundedRect(
      x,cardY,cw,ch,15,
      chosen?"#174e7b":"#0b3b67",
      chosen?"#8beaff":"#236ea8",
      chosen?4:2
    );

    // art
    drawCardArt(
      c,
      x+cw/2,
      cardY+ch*.42,
      Math.min(cw*.48,46),
      chosen
    );

    text(
      c.name,
      x+cw/2,
      cardY+ch-28,
      Math.max(10,Math.min(15,cw*.11)),
      "#fff","center",900
    );

    roundedRect(
      x+cw/2-17,
      cardY+ch-10,
      34,24,12,
      "#a934ed","#f0b3ff",2
    );

    text(c.cost,x+cw/2,cardY+ch+2,14,"#fff");
  });

  // elixir
  const ey=y+panelH-27;
  const ex=pad+42;
  const ew=W-pad*2-65;

  ctx.fillStyle="#071726";

  roundedRect(
    ex,ey,ew,17,9,
    "#071726","#1f6a98",2
  );

  const pct=elixir/10;

  const eg=ctx.createLinearGradient(ex,ey,ex+ew,ey);
  eg.addColorStop(0,"#8d27e8");
  eg.addColorStop(1,"#ef45dd");

  roundedRect(
    ex+2,ey+2,(ew-4)*pct,13,7,
    eg
  );

  ctx.fillStyle="#c629ee";
  ctx.beginPath();
  ctx.arc(ex-15,ey+8.5,24,0,TAU);
  ctx.fill();

  text("♦",ex-15,ey+8,18,"#ffd0ff");

  text(
    `${Math.floor(elixir)}/10`,
    ex+50,ey+8,
    16,"#fff","center",900
  );
}

function drawCardArt(c,x,y,s,chosen){
  ctx.save();

  if(chosen){
    const gl=ctx.createRadialGradient(
      x,y,2,x,y,s*1.8
    );

    gl.addColorStop(
      0,
      "rgba(255,255,255,.35)"
    );

    gl.addColorStop(
      1,
      "rgba(0,0,0,0)"
    );

    ctx.fillStyle=gl;
    ctx.beginPath();
    ctx.arc(x,y,s*1.7,0,TAU);
    ctx.fill();
  }

  if(c.type==="ember"){
    ctx.fillStyle="#ff6d20";
    ctx.beginPath();
    ctx.moveTo(x,y-s);
    ctx.lineTo(x+s*.75,y+s*.9);
    ctx.lineTo(x,y+s*.55);
    ctx.lineTo(x-s*.75,y+s*.9);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#242a34";
    ctx.beginPath();
    ctx.arc(x,y-s*.2,s*.48,0,TAU);
    ctx.fill();

    ctx.strokeStyle="#ffbd3b";
    ctx.lineWidth=5;
    ctx.beginPath();
    ctx.moveTo(x-s*.5,y+s*.45);
    ctx.lineTo(x+s*.7,y-s*.55);
    ctx.stroke();

  }else if(c.type==="sky"){
    ctx.fillStyle="#4cbfff";
    ctx.beginPath();
    ctx.moveTo(x,y-s);
    ctx.lineTo(x+s*.85,y+s*.65);
    ctx.lineTo(x,y+s*.35);
    ctx.lineTo(x-s*.85,y+s*.65);
    ctx.closePath();
    ctx.fill();

    ctx.fillStyle="#16284a";
    ctx.beginPath();
    ctx.arc(x,y,s*.34,0,TAU);
    ctx.fill();

    ctx.strokeStyle="#d6fbff";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x,y);
    ctx.lineTo(x+s*.9,y-s*.2);
    ctx.stroke();

  }else if(c.type==="iron"){
    ctx.fillStyle="#778e9e";
    ctx.beginPath();
    ctx.arc(x,y,s*.7,0,TAU);
    ctx.fill();

    ctx.fillStyle="#182b39";
    ctx.beginPath();
    ctx.arc(x,y,s*.42,0,TAU);
    ctx.fill();

    ctx.fillStyle="#58cfff";
    ctx.beginPath();
    ctx.arc(x,y,s*.18,0,TAU);
    ctx.fill();

    for(let a=0;a<4;a++){
      let aa=a*Math.PI/2;
      ctx.fillStyle="#b7c7d0";
      ctx.fillRect(
        x+Math.cos(aa)*s*.7-5,
        y+Math.sin(aa)*s*.7-5,
        10,10
      );
    }

  }else{
    ctx.fillStyle="#6ad8ff";
    ctx.beginPath();
    ctx.arc(x,y,s*.62,0,TAU);
    ctx.fill();

    ctx.fillStyle="#172b49";
    ctx.beginPath();
    ctx.arc(x-s*.2,y-s*.1,s*.12,0,TAU);
    ctx.arc(x+s*.2,y-s*.1,s*.12,0,TAU);
    ctx.fill();

    ctx.strokeStyle="#c6f7ff";
    ctx.lineWidth=3;
    ctx.beginPath();
    ctx.moveTo(x-s*.7,y);
    ctx.lineTo(x-s*1.05,y-s*.35);
    ctx.moveTo(x+s*.7,y);
    ctx.lineTo(x+s*1.05,y-s*.35);
    ctx.stroke();
  }

  ctx.restore();
}function spawn(team,card,x,y){
  const c=cards[card];

  troops.push({
    team,
    type:c.type,
    name:c.name,
    x,y,
    hp:c.hp,
    max:c.hp,
    damage:c.damage,
    range:c.range,
    speed:c.speed,
    rate:c.rate,
    cool:Math.random()*.4,
    level:team==="player"?3:3,
    r:c.type==="iron"?25:20
  });

  burst(x,y,c.color||"#fff",8);
}

function burst(x,y,color,n=10){
  for(let i=0;i<n;i++){
    const a=Math.random()*TAU;
    const sp=30+Math.random()*120;

    particles.push({
      x,
      y,
      vx:Math.cos(a)*sp,
      vy:Math.sin(a)*sp,
      life:.35+Math.random()*.55,
      max:.9,
      color,
      size:2+Math.random()*4
    });
  }
}

function projectile(x,y,tx,ty,color,damage){
  projectiles.push({
    x,y,tx,ty,color,damage,life:.35
  });
}

function nearestEnemyTroop(u){
  let best=null;
  let bd=Infinity;

  for(const v of troops){
    if(v.team===u.team||v.hp<=0)continue;

    const d=dist(u,v);

    if(d<bd){
      bd=d;
      best=v;
    }
  }

  return best;
}

function nearestTowerFor(u){
  const ets=aliveTowers(enemyTower(u.team));

  if(!ets.length)return null;

  let best=ets[0];
  let bd=Infinity;

  for(const t of ets){
    const p=towerPos(t);
    const d=Math.hypot(u.x-p.x,u.y-p.y);

    if(d<bd){
      bd=d;
      best=t;
    }
  }

  return best;
}

function updateTroops(dt){
  for(const u of troops){
    if(u.hp<=0)continue;

    u.cool-=dt;

    let target=nearestEnemyTroop(u);
    let d=target?dist(u,target):9999;

    if(!target||d>u.range){
      const tw=nearestTowerFor(u);

      if(tw){
        const p=towerPos(tw);
        const td=Math.hypot(
          u.x-p.x,
          u.y-p.y
        );

        if(td<=u.range){
          target=tw;
          d=td;
        }else{
          let dx=p.x-u.x;
          let dy=p.y-u.y;
          let len=Math.hypot(dx,dy)||1;

          u.x+=dx/len*u.speed*dt;
          u.y+=dy/len*u.speed*dt;

          // bridge bias
          if(Math.abs(u.y-riverY())<48){
            const bx=u.x<W/2?W*.34:W*.66;

            u.x+=clamp(
              bx-u.x,
              -80*dt,
              80*dt
            );
          }

          continue;
        }
      }
    }

    if(target&&d<=u.range){
      if(u.cool<=0){

        if(target.kind){
          target.hp-=u.damage;

          projectile(
            u.x,
            u.y,
            towerPos(target).x,
            towerPos(target).y,
            u.team==="player"?"#55dfff":"#ff6070",
            u.damage
          );

          burst(
            u.x,
            u.y,
            u.team==="player"?"#5edbff":"#ff6570",
            3
          );

        }else{
          target.hp-=u.damage;

          projectile(
            u.x,
            u.y,
            target.x,
            target.y,
            u.team==="player"?"#55dfff":"#ff6070",
            u.damage
          );
        }

        u.cool=u.rate;
      }
    }
  }

  troops=troops.filter(
    u=>u.hp>0&&u.y>-40&&u.y<H+40
  );
}

function updateTowers(dt){
  for(const t of towers){
    if(t.hp<=0)continue;

    t.cool-=dt;

    let best=null;
    let bd=t.range;

    const p=towerPos(t);

    for(const u of troops){
      if(u.team===t.team||u.hp<=0)continue;

      const d=Math.hypot(
        u.x-p.x,
        u.y-p.y
      );

      if(d<bd){
        bd=d;
        best=u;
      }
    }

    if(best&&t.cool<=0){
      best.hp-=t.damage;

      projectile(
        p.x,p.y,
        best.x,best.y,
        t.team==="player"?"#5edbff":"#ff6170",
        t.damage
      );

      burst(
        p.x,p.y,
        t.team==="player"?"#55dfff":"#ff6570",
        2
      );

      t.cool=t.rate;
    }
  }
}

function updateAI(dt){
  aiElixir=clamp(
    aiElixir+dt*.75,
    0,10
  );

  aiClock-=dt;

  if(aiClock<=0){
    const affordable=cards
      .map((c,i)=>({i,c}))
      .filter(o=>o.c.cost<=aiElixir);

    if(affordable.length){
      const pick=
        affordable[
          Math.floor(
            Math.random()*affordable.length
          )
        ];

      const side=
        Math.random()<.5?"left":"right";

      spawn(
        "enemy",
        pick.i,
        laneX(side)+(Math.random()-.5)*55,
        riverY()-95-Math.random()*80
      );

      aiElixir-=pick.c.cost;
    }

    aiClock=1.8+Math.random()*2.2;
  }
}

function updateParticles(dt){
  for(const p of particles){
    p.life-=dt;
    p.x+=p.vx*dt;
    p.y+=p.vy*dt;
    p.vx*=.97;
    p.vy*=.97;
  }

  particles=particles.filter(
    p=>p.life>0
  );

  for(const p of projectiles)
    p.life-=dt;

  projectiles=projectiles.filter(
    p=>p.life>0
  );
          }
      function drawTroops(){
  for(const u of troops){
    const friendly=u.team==="player";

    ctx.save();
    shadow();

    // shadow
    ctx.fillStyle="rgba(0,0,0,.22)";
    ctx.beginPath();
    ctx.ellipse(
      u.x,
      u.y+u.r*.75,
      u.r*.9,
      u.r*.32,
      0,0,TAU
    );
    ctx.fill();

    ctx.translate(u.x,u.y);

    if(u.type==="ember"){
      ctx.fillStyle="#ff6a20";
      ctx.beginPath();
      ctx.moveTo(0,-24);
      ctx.lineTo(18,16);
      ctx.lineTo(0,8);
      ctx.lineTo(-18,16);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle="#242b36";
      ctx.beginPath();
      ctx.arc(0,-7,14,0,TAU);
      ctx.fill();

      ctx.strokeStyle="#ffcc46";
      ctx.lineWidth=4;
      ctx.beginPath();
      ctx.moveTo(12,10);
      ctx.lineTo(30,-8);
      ctx.stroke();

    }else if(u.type==="sky"){
      ctx.fillStyle="#4bbfff";
      ctx.beginPath();
      ctx.moveTo(0,-22);
      ctx.lineTo(28,8);
      ctx.lineTo(0,4);
      ctx.lineTo(-28,8);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle="#17294a";
      ctx.beginPath();
      ctx.arc(0,-1,13,0,TAU);
      ctx.fill();

      ctx.strokeStyle="#d8fbff";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(0,0);
      ctx.lineTo(26,-12);
      ctx.stroke();

    }else if(u.type==="iron"){
      ctx.fillStyle="#788f9f";
      ctx.beginPath();
      ctx.arc(0,0,24,0,TAU);
      ctx.fill();

      ctx.fillStyle="#1b2d3b";
      ctx.beginPath();
      ctx.arc(0,-2,15,0,TAU);
      ctx.fill();

      ctx.fillStyle="#57d8ff";
      ctx.beginPath();
      ctx.arc(0,-2,6,0,TAU);
      ctx.fill();

      ctx.fillStyle="#aebfc8";

      for(let a=0;a<4;a++){
        let aa=a*Math.PI/2;

        ctx.fillRect(
          Math.cos(aa)*23-5,
          Math.sin(aa)*23-5,
          10,10
        );
      }

    }else{
      ctx.fillStyle="#69d8ff";
      ctx.beginPath();
      ctx.arc(0,0,18,0,TAU);
      ctx.fill();

      ctx.fillStyle="#142a49";
      ctx.beginPath();
      ctx.arc(-6,-3,3,0,TAU);
      ctx.arc(6,-3,3,0,TAU);
      ctx.fill();

      ctx.strokeStyle="#c8f9ff";
      ctx.lineWidth=3;
      ctx.beginPath();
      ctx.moveTo(-17,0);
      ctx.lineTo(-27,-12);
      ctx.moveTo(17,0);
      ctx.lineTo(27,-12);
      ctx.stroke();
    }

    shadow(false);
    ctx.restore();

    // level + hp
    roundedRect(
      u.x-22,
      u.y-u.r-25,
      44,6,3,
      "#101820"
    );

    roundedRect(
      u.x-21,
      u.y-u.r-24,
      42*clamp(u.hp/u.max,0,1),
      4,2,
      friendly?"#20d7ff":"#ff4a5a"
    );

    roundedRect(
      u.x-12,
      u.y-u.r-39,
      24,18,8,
      friendly?"#0a70c8":"#bd3040",
      "#fff",1
    );

    text(
      String(u.level),
      u.x,
      u.y-u.r-30,
      11,
      "#fff"
    );
  }
}

function drawEffects(){
  for(const p of particles){
    ctx.globalAlpha=
      clamp(p.life/p.max,0,1);

    ctx.fillStyle=p.color;

    ctx.beginPath();
    ctx.arc(
      p.x,p.y,p.size,
      0,TAU
    );
    ctx.fill();
  }

  ctx.globalAlpha=1;

  for(const p of projectiles){
    const t=1-p.life/.35;

    const x=lerp(p.x,p.tx,t);
    const y=lerp(p.y,p.ty,t);

    ctx.strokeStyle=p.color;
    ctx.lineWidth=4;

    ctx.beginPath();
    ctx.moveTo(p.x,p.y);
    ctx.lineTo(x,y);
    ctx.stroke();

    ctx.fillStyle="#fff";

    ctx.beginPath();
    ctx.arc(x,y,4,0,TAU);
    ctx.fill();
  }
}

function drawMenu(){
  ctx.fillStyle="rgba(3,12,20,.55)";
  ctx.fillRect(0,0,W,H);

  const h=Math.min(390,H-80);

  );

    W/2,y+102,
    16,"#a9dfff"
  );

  text(
    "VERSION 2.0",
    W/2,y+130,
    13,"#69d5ff"
  );

  text(
    "Build your lane. Protect your towers.",

  );

  text(

  );

    W/2-120,

  );

  );

function drawGameOver(){
  ctx.fillStyle="rgba(0,0,0,.58)";
  ctx.fillRect(0,0,W,H);

  const w=Math.min(410,W-32);
  const x=(W-w)/2;
  const y=H/2-160;

  roundedRect(
    x,y,w,320,28,
    "rgba(5,25,45,.98)",
    "#1a9ee8",3
  );

  const playerKing=
    towers.find(
      t=>t.team==="player"&&t.kind==="king"
    );

  const enemyKing=
    towers.find(
      t=>t.team==="enemy"&&t.kind==="king"
    );

  let result=
    playerKing.hp<=0
      ?"DEFEAT"
      :enemyKing.hp<=0
        ?"VICTORY"
        :"TIME UP";

  let sub=
    result==="VICTORY"
      ?"The Crystal Crown is yours!"
      :result==="DEFEAT"
        ?"Your fortress fell."
        :"The arena stands!";

  text(
    result,
    W/2,y+72,
    36,
    result==="VICTORY"
      ?"#ffd24a"
      :"#ff7180",
    "center",900
  );

  text(
    sub,
    W/2,y+120,
    15,"#d8efff"
  );

  roundedRect(
    W/2-105,
    y+170,
    210,55,18,
    "#087ecb",
    "#8deaff",3
  );

  text(
    "PLAY AGAIN",
    W/2,y+197,
    18,"#fff"
  );
}

function resetGame(){
  timeLeft=180;
  elixir=5;
  aiElixir=5;
  selectedCard=-1;
  troops=[];
  particles=[];
  projectiles=[];
  aiClock=1.8;
  message="";
  messageTime=0;
  shake=0;

  const vals=[
    3200,4500,3200,
    3200,4500,3200
  ];

  towers.forEach((t,i)=>{
    t.hp=vals[i];
    t.cool=0;
  });

  state="playing";
}

function tryDeploy(px,py){
  if(state!=="playing")return;

  if(py>riverY()-15)return;

  if(py<arenaBottom()-deckH()+0){}

  if(selectedCard<0){
    message="Choose a card first";
    messageTime=1.2;
    return;
  }

  const c=cards[selectedCard];

  if(elixir<c.cost){
    message="Not enough elixir";
    messageTime=1.2;
    return;
  }

  const x=clamp(
    px,
    W*.12,
    W*.88
  );

  const y=clamp(
    py,
    riverY()+55,
    arenaBottom()-55
  );

  spawn(
    "player",
    selectedCard,
    x,y
  );

  elixir-=c.cost;
  selectedCard=-1;
}

function pointer(e){
  const r=canvas.getBoundingClientRect();

  return {
    x:e.clientX-r.left,
    y:e.clientY-r.top
  };
}

canvas.addEventListener(
  "pointerdown",
  e=>{
    const p=pointer(e);

    if(state==="menu"){
      resetGame();
      return;
    }

    if(state==="gameover"){
      resetGame();
      return;
    }

    const y=H-deckH()+8;

    if(p.y>=y){
      const gap=8;
      const pad=18;
      const cw=
        (W-pad*2-gap*3)/4;

      for(let i=0;i<4;i++){
        const x=pad+i*(cw+gap);

        if(
          p.x>=x &&
          p.x<=x+cw
        ){
          if(elixir>=cards[i].cost){
            selectedCard=
              selectedCard===i
                ?-1
                :i;
          }else{
            message="Need more elixir";
            messageTime=1.1;
          }

          return;
        }
      }

    }else{
      tryDeploy(p.x,p.y);
    }
  }
);

function update(dt){
  if(state!=="playing")return;

  timeLeft-=dt;

  elixir=clamp(
    elixir+dt*.72,
    0,10
  );

  if(messageTime>0)
    messageTime-=dt;

  updateAI(dt);
  updateTroops(dt);
  updateTowers(dt);
  updateParticles(dt);

  const pk=
    towers.find(
      t=>t.team==="player"&&t.kind==="king"
    );

  const ek=
    towers.find(
      t=>t.team==="enemy"&&t.kind==="king"
    );

  if(
    timeLeft<=0||
    pk.hp<=0||
    ek.hp<=0
  ){
    state="gameover";
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  drawBackground();
  drawTopHUD();

  towers.forEach(drawTower);

  drawTroops();
  drawEffects();
  drawDeck();

  if(messageTime>0){
    roundedRect(
      W/2-110,
      arenaTop()+8,
      220,34,15,
      "rgba(5,20,30,.88)",
      "#5acbff",2
    );

    text(
      message,
      W/2,
      arenaTop()+25,
      13,
      "#fff"
    );
  }

  if(
    selectedCard>=0 &&
    state==="playing"
  ){
    ctx.strokeStyle=
      "rgba(130,235,255,.55)";

    ctx.lineWidth=3;
    ctx.setLineDash([8,8]);

    ctx.strokeRect(
      8,
      riverY()+8,
      W-16,
      arenaBottom()-riverY()-18
    );

    ctx.setLineDash([]);

    text(
      "Tap your side to deploy",
      W/2,
      riverY()+22,
      12,
      "#e8fbff"
    );
  }

  if(state==="menu")
    drawMenu();

  if(state==="gameover")
    drawGameOver();
}

function loop(now){
  const dt=
    Math.min(
      .05,
      (now-last)/1000||0
    );

  last=now;

  update(dt);
  draw();

  requestAnimationFrame(loop);
}

document.getElementById("loading").remove();

requestAnimationFrame(loop);
</script>
